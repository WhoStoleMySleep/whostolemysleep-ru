version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      # Мелкие подъёмы — одним PR: CI всё равно прогоняет набор целиком,
      # а десять отдельных запросов на слияние в неделю никто не читает.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: chore
