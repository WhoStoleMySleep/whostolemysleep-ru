version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    ignore:
      # 2.17.6 moved htmlparser2 to a major that is ESM-only while sanitize-html
      # itself stayed CommonJS, so the bundled server died with ERR_REQUIRE_ESM on
      # its first request. The version in package.json is pinned exactly; unpin it
      # together with this entry once upstream ships a release that loads.
      - dependency-name: sanitize-html
      # Declared only for the H3Event type and has to match the copy Nuxt runs on, so
      # CI cannot tell a major bump is wrong: it would describe a version the server
      # does not use. Unignore it when Nuxt moves to h3 2.
      - dependency-name: h3
        update-types: ["version-update:semver-major"]
    groups:
      # Small bumps go in one PR: CI runs the whole suite either way, and nobody
      # reads ten separate merge requests a week.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: chore
